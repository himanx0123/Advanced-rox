name: Build Rox
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o Rox_V3.zip -d proj
      - name: Add icon and name
        run: |
          APP_NAME="Rox"
          cd proj/app/src/main
          mkdir -p res/drawable res/mipmap-anydpi-v26
          cat > res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B1026"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF
          cat > res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#00E5FF"
                  android:strokeWidth="3"
                  android:pathData="M54,54m-26,0a26,26 0,1 1,52 0a26,26 0,1 1,-52 0" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#00B8D4"
                  android:strokeWidth="2"
                  android:pathData="M54,54m-17,0a17,17 0,1 1,34 0a17,17 0,1 1,-34 0" />
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M54,54m-7,0a7,7 0,1 1,14 0a7,7 0,1 1,-14 0" />
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M52.5,22h3v6h-3z M52.5,80h3v6h-3z M22,52.5h6v3h-6z M80,52.5h6v3h-6z" />
          </vector>
          EOF
          for n in ic_launcher ic_launcher_round; do
          cat > res/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          done
          sed -i "s|^        android:label=\"Rox\"\$|        android:label=\"$APP_NAME\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"|" AndroidManifest.xml
          grep -n "ic_launcher" AndroidManifest.xml
      - name: Download Hindi model
        run: |
          cd proj/app/src/main
          mkdir -p assets
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q m.zip
          mv vosk-model-small-hi-0.22 assets/model-hi
          echo "rox-hi-1" > assets/model-hi/uuid
          rm m.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle assembleDebug
        working-directory: proj
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
